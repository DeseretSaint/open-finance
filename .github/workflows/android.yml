name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Prepare Capacitor android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Grant gradle wrapper permission
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign release APK (guarded — needs secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/keystore.jks
          ./android/gradlew -p android assembleRelease \
            -Pandroid.injected.signing.store.file=keystore.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD" \
            --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: open-finance-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Compute SHA256SUMS
        if: ${{ !cancelled() }}
        working-directory: android/app/build/outputs/apk
        run: |
          find . -name "*.apk" -exec sha256sum {} \; | tee SHA256SUMS
      - name: Upload SHA256SUMS
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: android/app/build/outputs/apk/SHA256SUMS
          if-no-files-found: warn
