name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cap_server_url:
        description: "Hub URL for a connected APK (e.g. http://192.168.1.10:3000). Empty = bundled/solo build."
        type: string
        required: false
        default: ""

# Least-privilege: this runs on pull_request (incl. fork PRs); pin the token to
# read-only so a compromised/malicious PR cannot write to the repo or exfiltrate
# a write-scoped GITHUB_TOKEN. The called apk-build.yml declares its own
# permissions (contents: read).
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    uses: ./.github/workflows/apk-build.yml
    with:
      cap_server_url: ${{ inputs.cap_server_url || '' }}
    secrets: inherit
