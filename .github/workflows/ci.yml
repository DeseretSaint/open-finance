name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: this runs on pull_request (incl. fork PRs); pin the token to
# read-only so a compromised/malicious PR cannot write to the repo or exfiltrate
# a write-scoped GITHUB_TOKEN. (apk-build.yml sets its own permissions.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migration bundle parity (solo schema == migrations/)
        run: pnpm check:migrations

      - name: Unit & integration tests
        env:
          ENCRYPTION_KEY: ci-test-encryption-key
          AUTH_SECRET: ci-test-auth-secret
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          ENCRYPTION_KEY: build-time-dummy
          AUTH_SECRET: build-time-dummy

      - name: Design tokens lint
        run: pnpm dlx @google/design.md lint docs/DESIGN.md

      - name: Dependency audit
        run: pnpm audit --prod

      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
