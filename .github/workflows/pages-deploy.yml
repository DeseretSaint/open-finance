# GitHub Pages deploy of the browser-solo PWA (PAGES=1 static export).
#
# Deploys via the legacy gh-pages branch: deploy-pages v4 (workflow build_type)
# kept timing out polling Pages ("Current status:" empty -> Timeout reached),
# so we build with PAGES_BASE_PATH=/open-finance and push dist/mobile to the
# gh-pages branch, which Pages serves from "/" of that branch.
name: pages-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      ENCRYPTION_KEY: build-time-dummy
      AUTH_SECRET: build-time-dummy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build browser-solo export (Pages layout)
        run: |
          PAGES=1 PAGES_BASE_PATH=/open-finance node scripts/build-mobile.mjs
      - name: SPA-ish fallback (404.html copy of index)
        run: cp dist/mobile/index.html dist/mobile/404.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/mobile
          publish_branch: gh-pages
          force_orphan: true
